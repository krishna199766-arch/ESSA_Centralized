{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="text-center mb-3 fw-bold" style="color: var(--brand-dark);">
          {{ SHOP_NAME }}
        </h3>
        <p class="text-center text-muted mb-4">Sign in to continue</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <button class="btn btn-brand w-100">Login</button>
        </form>
        <p class="text-muted small text-center mt-3">Default: admin / admin123</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
