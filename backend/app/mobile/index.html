<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#5A3428" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ESSA AI" />
<link rel="manifest" href="/m/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/m/icon.png" />
<title>ESSA AI</title>
<style>
:root{--bg:#F5F2F0;--panel:#FFFFFF;--panel2:#F2EEEB;--line:#E4DCD7;--line2:#96867C;--text:#2A2320;--muted:#7C6F68;--accent:#5A3428;--accent2:#7A4C3D;--ok:#1E7A4D;--okbg:#E7F4ED;--warn:#B45309;--warnbg:#FDF2E3;--danger:#C0392B;--dangerbg:#FBEBE9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{min-height:100%;display:flex;flex-direction:column}
.pad{padding:env(safe-area-inset-top) 0 0 0}
input,select,button,textarea{font:inherit;color:var(--text)}
input,select{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 12px;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}
.field{margin-bottom:13px}
.btn{width:100%;background:var(--accent);border:none;border-radius:10px;padding:14px;font-weight:700;font-size:16px;color:#fff}
.btn:disabled{opacity:.6}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px}
.logo{color:var(--accent);font-size:46px;font-weight:900;letter-spacing:2px}
.brand{font-size:24px;font-weight:800;margin-top:6px}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 20px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.err{color:var(--danger);font-size:13px;text-align:center;margin:6px 0}
.topbar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:17px;margin:0;flex:1}
.topbar .count{color:var(--muted);font-size:12px}
.link{color:var(--accent);font-size:13px;background:none;border:none;padding:6px}
.controls{padding:12px 14px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.row{display:flex;gap:8px}
/* A flex item defaults to min-width:auto, so a 100%-wide <input> beside two
   buttons refuses to shrink below its intrinsic size and pushes the whole
   page wider than the phone — every row then sits shifted with its right
   edge off-screen. Letting row children shrink is the fix. */
.row>*{min-width:0}
.chip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:8px 15px;font-size:14px;color:var(--muted);text-transform:capitalize}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* camera scanner overlay */
.scanov{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center}
.scanov video{width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;width:68vw;height:68vw;max-width:320px;max-height:320px;
  border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanhint{position:absolute;bottom:120px;left:0;right:0;text-align:center;color:#fff;
  font-size:15px;text-shadow:0 1px 4px #000;padding:0 24px}
.scanx{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  background:#fff;color:#111;border:none;border-radius:24px;padding:13px 30px;font-size:16px;font-weight:700}
.list{flex:1;overflow:auto;padding:0 14px 24px}
.prow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px}
.prow .t{font-weight:600}
.prow .m{color:var(--muted);font-size:12px;margin-top:3px}
.badge{border-radius:20px;padding:4px 10px;font-size:11px;flex:0 0 auto}
.bpend{background:var(--warnbg);color:var(--warn)}
.bdone{background:var(--okbg);color:var(--ok)}
.detwrap{flex:1;overflow:auto;padding:16px}
.detname{font-size:20px;font-weight:700}
.detmeta{color:var(--muted);font-size:13px;margin-top:4px}
.sheet{position:fixed;inset:0;background:rgba(42,35,32,.45);display:flex;align-items:flex-end;z-index:20}
.sheetcard{background:var(--panel);width:100%;border-radius:16px 16px 0 0;max-height:80vh;display:flex;flex-direction:column}
.sheethd{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);font-weight:700}
.opt{padding:15px 18px;border-bottom:1px solid var(--line);font-size:16px}
.opt.sel{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;z-index:40;font-size:14px}
.hint{color:var(--muted);font-size:11px;margin-top:2px}
.selbtn{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.selbtn.empty{color:var(--muted)}
.spin{border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;width:26px;height:26px;animation:sp 1s linear infinite;margin:30px auto}
/* the bar that carries the one action a screen commits to (post, save) */
.actionbar{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<script>
const S = { token: localStorage.getItem('essa_token')||'', user: localStorage.getItem('essa_user')||'',
            screen:'login', products:[], options:{}, status:'pending', q:'', barcode:'', selected:null, employee: localStorage.getItem('essa_emp')||'',
            // consignments waiting to be taken in (LR register rows)
            lr:[], lrFilter:'pending', lrSel:null, receivers:[],
            // goods receipts: the bundle a supplier billed, broken into what arrived
            grns:[], grnFilter:'draft', grn:null, grnLine:null, srows:[], sopen:{},
            cats:[], postResult:null,
            // shortage entry: what was billed and wasn't in the box
            shortLine:null, shrows:[], shortOpts:null,
            // cartons: the first label, printed at GRN and scanned around the warehouse
            bundles:[], bundleFilter:'stored', bundle:null, locations:[] };
const app = document.getElementById('app');
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (v)=> v==null?'—': Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});

async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail || ('HTTP '+r.status));
  return j;
}
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

// ---------- boot ----------
(async function boot(){
  if(S.token){
    try{ const v = await api('/api/auth/verify?token='+encodeURIComponent(S.token)); if(v.ok){ S.screen='list'; await loadOptions(); return render(); } }catch(e){}
  }
  S.screen='login'; render();
})();

async function loadOptions(){ try{ S.options = await api('/api/inventory/product-options'); }catch(e){ S.options={}; }
  loadLocations(); }

// ---------- render ----------
function render(){
  if(S.screen==='login') return renderLogin();
  if(S.screen==='detail') return renderDetail();
  if(S.screen==='lr') return renderLR();
  if(S.screen==='lrdetail') return renderLRDetail();
  if(S.screen==='grn') return renderGrnList();
  if(S.screen==='grndetail') return renderGrn();
  if(S.screen==='grnbreak') return renderBreak();
  if(S.screen==='grnshort') return renderShort();
  if(S.screen==='grnposted') return renderPosted();
  if(S.screen==='bundles') return renderBundles();
  if(S.screen==='bundle') return renderBundle();
  return renderList();
}

// What the warehouse does on the phone, in the order the goods move: take the
// consignment in, receive what the cartons hold, store and later open those
// cartons, and detail the products that come out of them.
function tabs(active){
  return `<div class="row" style="gap:8px;overflow:auto">
    <div class="chip ${active==='lr'?'on':''}" data-tab="lr">Consignments</div>
    <div class="chip ${active==='grn'?'on':''}" data-tab="grn">Receive</div>
    <div class="chip ${active==='bundles'?'on':''}" data-tab="bundles">Bundles</div>
    <div class="chip ${active==='list'?'on':''}" data-tab="list">Products</div>
  </div>`;
}
function wireTabs(){
  app.querySelectorAll('.chip[data-tab]').forEach(c=>c.onclick=()=>{
    if(S.screen===c.dataset.tab) return;
    S.screen=c.dataset.tab; render();
  });
}
function renderLogin(){
  app.innerHTML = `<div class="center">
    <div class="logo">AI</div>
    <div class="brand">ESSA <span>·</span> Warehouse</div>
    <div class="sub">Sign in to receive goods &amp; detail products</div>
    <div class="card">
      <div class="field"><label>Username</label><input id="u" autocapitalize="none" value="admin"></div>
      <div class="field"><label>Password</label><input id="p" type="password" placeholder="••••••••"></div>
      <div class="field"><label>Your name (saved with what you receive &amp; detail)</label><input id="emp" placeholder="e.g. Ramesh" value="${esc(S.employee)}"></div>
      <div id="err" class="err"></div>
      <button class="btn" id="go">Sign in</button>
    </div></div>`;
  document.getElementById('go').onclick = async ()=>{
    const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
    S.employee=document.getElementById('emp').value.trim(); localStorage.setItem('essa_emp',S.employee);
    document.getElementById('go').disabled=true; document.getElementById('err').textContent='';
    try{ const r= await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
      S.token=r.token; S.user=r.user; localStorage.setItem('essa_token',r.token); localStorage.setItem('essa_user',r.user||'');
      await loadOptions(); S.screen='list'; render();
    }catch(e){ document.getElementById('err').textContent=e.message; document.getElementById('go').disabled=false; }
  };
}

async function fetchProducts(){
  try{ S.products = await api(`/api/inventory/products?status=${S.status}&q=${encodeURIComponent(S.q)}`); }
  catch(e){ S.products=[]; toast('Could not load products'); }
}

async function renderList(){
  app.innerHTML = `<div class="topbar"><h1>Products</h1><span class="count" id="cnt"></span><button class="link" id="lo">Logout</button></div>
    <div class="controls">
      ${tabs('list')}
      <div class="row"><input id="bc" placeholder="Enter / scan code…" autocapitalize="characters" enterkeyhint="go"><button class="btn" style="width:auto;padding:12px 14px" id="bcscan" title="Scan with the camera">⛶</button><button class="btn" style="width:auto;padding:12px 18px" id="bcgo">Go</button></div>
      <input id="q" placeholder="Search SKU, description…" enterkeyhint="search" value="${esc(S.q)}">
      <div class="row" style="overflow:auto">
        ${['pending','all','detailed'].map(st=>`<div class="chip ${S.status===st?'on':''}" data-st="${st}">${st}</div>`).join('')}
        <div class="chip" id="refresh" style="margin-left:auto">↻</div>
      </div>
    </div>
    <div class="list" id="list"><div class="spin"></div></div>`;
  document.getElementById('lo').onclick=()=>{ localStorage.removeItem('essa_token'); S.token=''; S.screen='login'; render(); };
  wireTabs();
  document.getElementById('bcgo').onclick=doBarcode;
  document.getElementById('bcscan').onclick=()=>openScanner();
  document.getElementById('bc').addEventListener('keydown',e=>{if(e.key==='Enter')doBarcode();});
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){S.q=e.target.value;paint();}});
  document.getElementById('refresh').onclick=()=>{S.q=document.getElementById('q').value;paint();};
  app.querySelectorAll('.chip[data-st]').forEach(c=>c.onclick=()=>{S.status=c.dataset.st;paint();});
  paint();
}
// Resolve whatever came off the scanner: a QR payload (JSON), an EAN-13, a SKU
// or an id. /lookup understands all four, so the same path serves both symbologies
// on the label. Falls back to a text search so typing a partial description works.
async function resolveCode(code){
  const c=(code||'').trim(); if(!c) return null;
  try{ return await api(`/api/inventory/lookup?code=${encodeURIComponent(c)}`); }
  catch(e){}
  try{ const data=await api(`/api/inventory/products?status=all&q=${encodeURIComponent(c)}`);
    return data.find(p=>(p.barcode||'')===c)||data[0]||null;
  }catch(e){ return null; }
}
async function doBarcode(){
  const b=document.getElementById('bc').value.trim(); if(!b) return;
  const p=await resolveCode(b);
  if(p){ S.selected=p; S.detailBack='list'; S.screen='detail'; render(); }
  else toast('No product for that code');
}

// ---- camera scanning -------------------------------------------------------
// Uses the browser's built-in BarcodeDetector: no external library, so the app
// stays a single self-contained file with no CDN to reach. Available on Android
// Chrome/Edge and desktop Chrome; iOS Safari has no implementation, so there the
// text field (hardware scanner or typing) remains the way in.
const SCAN_FORMATS=['qr_code','ean_13','code_128','ean_8','code_39'];
let scanStop=null;

function closeScanner(){
  if(scanStop){ scanStop(); scanStop=null; }
  const ov=document.getElementById('scanov'); if(ov) ov.remove();
}

// `onCode` receives the raw scan when the caller wants to do something other than
// open the product — pinning a GRN line to an existing item, for instance.
async function openScanner(onCode){
  if(!('BarcodeDetector' in window)){
    toast('This browser can’t use the camera scanner — type or use a handheld scanner');
    document.getElementById('bc')?.focus();
    return;
  }
  let supported=[];
  try{ supported=await window.BarcodeDetector.getSupportedFormats(); }catch(e){}
  const formats=SCAN_FORMATS.filter(f=>!supported.length||supported.includes(f));
  if(!formats.length){ toast('Camera scanner not supported here'); return; }

  const ov=document.createElement('div');
  ov.id='scanov'; ov.className='scanov';
  ov.innerHTML=`<video id="scanvid" playsinline muted></video>
    <div class="scanframe"></div>
    <div class="scanhint">Point at the QR or barcode on the label</div>
    <button class="scanx" id="scanx">Cancel</button>`;
  document.body.appendChild(ov);
  document.getElementById('scanx').onclick=closeScanner;

  const vid=document.getElementById('scanvid');
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    closeScanner();
    toast(e&&e.name==='NotAllowedError' ? 'Camera permission denied'
                                        : 'Could not open the camera');
    return;
  }
  vid.srcObject=stream;
  try{ await vid.play(); }catch(e){}

  const detector=new window.BarcodeDetector({formats});
  let alive=true;
  scanStop=()=>{ alive=false; stream.getTracks().forEach(t=>t.stop()); };

  // ~6 detections/sec: fast enough to feel instant, slow enough not to pin the CPU
  while(alive){
    try{
      const hits=await detector.detect(vid);
      if(hits&&hits.length){
        const code=hits[0].rawValue;
        closeScanner();
        if(onCode) return onCode(code);
        const p=await resolveCode(code);
        if(p){ S.selected=p; S.detailBack='list'; S.screen='detail'; render(); }
        else toast('Scanned, but no product matches that code');
        return;
      }
    }catch(e){ /* a frame that isn't decodable yet — keep going */ }
    await new Promise(r=>setTimeout(r,160));
  }
}
async function paint(){
  const el=document.getElementById('list'); if(el) el.innerHTML='<div class="spin"></div>';
  await fetchProducts();
  const cnt=document.getElementById('cnt');
  if(cnt) cnt.textContent = S.products.length+' shown';
  const list=document.getElementById('list'); if(!list) return;
  if(!S.products.length){ list.innerHTML='<p style="color:var(--muted);text-align:center;margin-top:30px">No products.</p>'; return; }
  list.innerHTML = S.products.map((p,i)=>`<div class="prow" data-i="${i}">
      <div style="flex:1;min-width:0"><div class="t">${esc(p.description)}</div>
      <div class="m">${esc(p.sku)} · stock ${p.stock_qty} ${esc(p.uom||'')}</div></div>
      <div class="badge ${p.detailed?'bdone':'bpend'}">${p.detailed?'detailed':'pending'}</div></div>`).join('');
  list.querySelectorAll('.prow').forEach(r=>r.onclick=()=>{ S.selected=S.products[+r.dataset.i]; S.detailBack='list'; S.screen='detail'; render(); });
}

// ---------- receive: the bundle a supplier billed, broken into what arrived ----------
// A supplier bills "WOMEN'S T-SHIRT, 50 PCS" and never prints the mix. Only the
// person opening the cartons knows it, so the breakdown is entered here, and
// posting turns every row into its own product — its own SKU, QR, stock movement
// and weighted-average cost. Same endpoints the desktop calls, so stock is
// identical whichever end does it. Unposting stays on the desktop: it has to
// weigh payments, debit notes and dispatches first.
const SPLIT_ATTRS=[['size','Size'],['color','Colour'],['material','Material'],
  ['pattern','Pattern'],['fit','Fit'],['product_type','Type'],['design_no','Design No']];
const SPLIT_MONEY=[['rate','Rate'],['mrp','MRP'],['sale_price','Sale price'],['sale_discount_pct','Disc %']];
const qtyOf=(v)=>Math.round((+v||0)*1000)/1000;
// quantities are floats — compare with the tolerance the server posts with
const sameQty=(a,b)=>Math.abs((+a||0)-(+b||0))<0.001;
const vLabel=(r)=>SPLIT_ATTRS.map(([k])=>r[k]).filter(Boolean).join(' · ');
const blankRow=(rate,cat)=>Object.assign(
  {category:cat||'',qty:'',rate:rate!=null?String(rate):'',mrp:'',sale_price:'',sale_discount_pct:''},
  Object.fromEntries(SPLIT_ATTRS.map(([k])=>[k,''])));
const logout=()=>{ localStorage.removeItem('essa_token'); S.token=''; S.screen='login'; render(); };

async function loadCats(){ try{ const c=await api('/api/masters/categories'); S.cats=(c.items||[]).map(i=>i.name); }catch(e){ S.cats=[]; } }
async function reloadGrn(){ S.grn=await api('/api/purchases/'+S.grn.id); }

async function renderGrnList(){
  app.innerHTML=`<div class="topbar"><h1>Goods receipts</h1><span class="count" id="gcnt"></span><button class="link" id="lo3">Logout</button></div>
    <div class="controls">
      ${tabs('grn')}
      <div class="row" style="overflow:auto">
        ${['draft','posted','all'].map(f=>`<div class="chip ${S.grnFilter===f?'on':''}" data-gf="${f}">${f}</div>`).join('')}
        <div class="chip" id="grefresh" style="margin-left:auto">↻</div>
      </div>
      <div class="hint">Open a receipt to break its bundles into the sizes that arrived, then post it to stock</div>
    </div>
    <div class="list" id="glist"><div class="spin"></div></div>`;
  document.getElementById('lo3').onclick=logout;
  document.getElementById('grefresh').onclick=paintGrns;
  app.querySelectorAll('.chip[data-gf]').forEach(c=>c.onclick=()=>{ S.grnFilter=c.dataset.gf; paintGrns(); });
  wireTabs();
  if(!S.cats.length) loadCats();
  paintGrns();
}

async function paintGrns(){
  const el=document.getElementById('glist'); if(el) el.innerHTML='<div class="spin"></div>';
  try{ S.grns=await api('/api/purchases'); }catch(e){ S.grns=[]; toast('Could not load goods receipts'); }
  const rows=S.grns.filter(g=>S.grnFilter==='all'||g.status===S.grnFilter);
  const cnt=document.getElementById('gcnt'); if(cnt) cnt.textContent=rows.length+' shown';
  const list=document.getElementById('glist'); if(!list) return;
  if(!rows.length){
    list.innerHTML=`<p style="color:var(--muted);text-align:center;margin-top:30px;line-height:1.5">${
      S.grnFilter==='draft'?'Nothing to receive. A receipt appears here once its invoice has been read and confirmed on the desktop app.':'No goods receipts.'}</p>`;
    return;
  }
  list.innerHTML=rows.map((g,i)=>`<div class="prow" data-i="${i}">
      <div style="flex:1;min-width:0">
        <div class="t">${esc(g.supplier_name||('GRN #'+g.id))}</div>
        <div class="m">Inv ${esc(g.invoice_number||'—')}${g.invoice_date?' · '+esc(g.invoice_date):''} · ₹ ${money(g.grand_total)}</div>
        <div class="m">${g.line_count} line${g.line_count===1?'':'s'}${g.new_products?` · ${g.new_products} new product${g.new_products===1?'':'s'}`:''}${g.grn_no?' · GRN '+esc(g.grn_no):''}</div>
        ${g.short_qty?`<div class="m" style="color:var(--warn)">⚠ ${qtyOf(g.short_qty)} short — ₹${money(g.short_value)} to claim</div>`:''}
      </div>
      <div class="badge ${g.status==='posted'?'bdone':'bpend'}">${esc(g.status)}</div></div>`).join('');
  list.querySelectorAll('.prow').forEach(r=>r.onclick=()=>openGrn(rows[+r.dataset.i].id));
}

async function openGrn(id){
  try{ S.grn=await api('/api/purchases/'+id); S.screen='grndetail'; render(); }
  catch(e){ toast('Could not open that receipt: '+e.message); }
}

// ---------- one receipt: every billed line, and what it really was ----------
function renderGrn(){
  const g=S.grn; if(!g){ S.screen='grn'; return render(); }
  const editable=g.status!=='posted';
  const unbal=(g.unbalanced_splits||[]).length;
  const short=g.shortages||{claimable_qty:0,claimable_value:0};
  // the server says outright whether the bundle is split; falling back to the rows
  // keeps an older server from making a broken-down bundle read as a plain product
  const split=(l)=>l.is_split!=null?l.is_split:l.splits.length>0;
  // the balance the breakdown hasn't accounted for — the number that is either a
  // shortage or still to be typed, and the whole reason this screen used to dead-end
  const gap=(l)=>qtyOf((l.received_qty!=null?l.received_qty:l.qty)-(l.split_qty||0));
  const lineHtml=(l,i)=>`<div class="prow" style="display:block">
      <div class="row" style="align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div class="t">${esc(l.description||'(unnamed)')}</div>
          <div class="m">HSN ${esc(l.hsn||'—')} · ${qtyOf(l.qty)} ${esc(l.uom||'')} × ₹${money(l.rate)} = ₹${money(l.amount)}</div>
          ${l.has_shortage?`<div class="m" style="color:var(--warn)">Billed ${qtyOf(l.qty)}, received <b>${qtyOf(l.received_qty)}</b>${
              l.missing_qty?` — ${qtyOf(l.missing_qty)} ${l.damaged_qty&&!l.short_qty?'damaged':'short'}, ₹${money(l.shortage_value)} to claim`:''}${
              l.excess_qty?` — ${qtyOf(l.excess_qty)} extra`:''}</div>`:''}
          ${split(l)?`<div class="m">Bundle split into ${l.splits.length} item${l.splits.length===1?'':'s'} — the rows below carry the stock, not this line.</div>`:''}
          ${l.splits.length&&!l.split_balanced?`<div class="m" style="color:var(--warn)">${qtyOf(l.split_remainder)} of ${qtyOf(l.received_qty!=null?l.received_qty:l.qty)} still to break down</div>`:''}
        </div>
        ${split(l)
          ? `<div class="badge ${l.split_balanced?'bdone':'bpend'}">split · ${l.splits.length}${l.split_balanced?'':' ⚠'}</div>`
          : `<div class="badge ${l.is_new_product?'bpend':'bdone'}">${l.is_new_product?'new':'matched'}</div>`}
      </div>
      ${/* The moment the receiver is stuck: the rows don't reach the billed
            quantity because the pieces aren't there. One tap says so, with the
            number already filled in, instead of leaving invent-or-abandon as the
            only two options. */''}
      ${editable&&!l.has_shortage&&l.splits.length&&!l.split_balanced&&gap(l)>0
        ? `<button class="link" style="padding:8px 0;display:block;text-align:left;color:var(--warn)" data-shortgap="${i}">
             ${gap(l)} not in the box? record as shortage →</button>`
        : ''}
      <div class="row" style="align-items:center;gap:8px;margin-top:10px">
        <span style="color:var(--muted);font-size:12px;flex:0 0 62px">Category</span>
        ${editable
          ? `<button class="selbtn ${l.category?'':'empty'}" data-cat="${i}" style="flex:1;padding:9px 12px;font-size:14px">${esc(l.category||(l.category_suggestion&&l.category_suggestion.best)||'auto')}</button>`
          : `<span style="font-size:13px">${esc(l.category||l.product_category||'auto')}</span>`}
      </div>
      ${editable&&!l.category&&l.category_suggestion&&l.category_suggestion.best
        /* one tap to accept what the classifier read from the description — and
           whichever category ends up here is remembered for this wording, so the
           next invoice that says it this way arrives already mapped */
        ? `<button class="link" style="padding:6px 0;display:block;text-align:left" data-usecat="${i}">use ${esc(l.category_suggestion.best)}${
            l.category_suggestion.via==='alias' ? ' · learned' : (l.category_suggestion.confident?'':' ?')}</button>`
        : ''}
      ${l.splits.map(sp=>`<div class="row" style="align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:9px;padding-top:9px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">↳ ${esc(sp.label)}</div>
            <div class="m">${qtyOf(sp.qty)} × ₹${money(sp.rate)} = ₹${money(sp.amount)}${sp.mrp?' · MRP '+money(sp.mrp):''}</div>
            <div class="m">${esc(sp.product_sku||(g.status==='posted'?'—':'SKU + QR on post'))}</div>
          </div>
          ${sp.product_id&&g.status==='posted'
            ? `<img src="/api/inventory/products/${sp.product_id}/qr.svg?scale=2" alt="QR" style="width:46px;height:46px;background:#fff;border-radius:6px;padding:2px">` : ''}
          ${editable&&!sp.product_id
            ? `<button class="btn sec" style="width:auto;padding:9px 12px" data-scan="${i}" data-split="${sp.id}">⌗ QR</button>` : ''}
        </div>`).join('')}
      ${(l.shortages||[]).map(sh=>`<div class="row" style="align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:9px;padding-top:9px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:${sh.kind==='excess'?'var(--ok)':'var(--warn)'}">
              ⚠ ${qtyOf(sh.qty)} ${esc(sh.kind)}${sh.variant?' · '+esc(sh.variant):''}</div>
            <div class="m">${esc(sh.reason||'no reason given')}${sh.claimable?` · ₹${money(sh.amount)} to claim`:''}</div>
            <div class="m">${esc(sh.recorded_by?('by '+sh.recorded_by):'')}${sh.status!=='open'?' · '+esc(sh.status):''}</div>
          </div>
        </div>`).join('')}
      ${editable?`<div class="row" style="margin-top:11px;gap:8px">
          <button class="btn sec" data-break="${i}">${l.splits.length?'Edit breakdown':'Break down into sizes'}</button>
          ${!l.splits.length?`<button class="btn sec" style="width:auto;padding:12px 14px" data-scan="${i}">⌗ QR</button>`:''}
        </div>
        <button class="btn sec" style="margin-top:8px${l.has_shortage?'':';color:var(--muted)'}" data-short="${i}">
          ${l.has_shortage?'Edit shortage':'⚠ Something missing or damaged?'}</button>`:''}
    </div>`;

  app.innerHTML=`<div class="topbar"><button class="link" id="back">‹ GRNs</button>
      <h1>${esc(g.supplier_name||('GRN #'+g.id))}</h1>
      <div class="badge ${g.status==='posted'?'bdone':'bpend'}">${esc(g.status)}</div></div>
    <div class="list" style="padding-top:12px">
      <div class="prow" style="display:block">
        <div class="m">Invoice ${esc(g.invoice_number||'—')}${g.invoice_date?' · '+esc(g.invoice_date):''}</div>
        <div class="m">GRN No ${esc(g.grn_no||'—')} · ${g.line_count} line${g.line_count===1?'':'s'}</div>
        <div class="t" style="margin-top:6px">Grand total ₹ ${money(g.grand_total)}</div>
      </div>
      ${g.lines.map(lineHtml).join('')}
    </div>
    <div class="actionbar">
      ${short.claimable_qty?`<div class="hint" style="margin-bottom:7px;color:var(--warn)">
        ⚠ ${qtyOf(short.claimable_qty)} short or damaged across this receipt — ₹${money(short.claimable_value)} to claim back.
        ${g.status==='posted'?'Raise the debit note from Returns on the desktop.':'It stays off the stock; the invoice keeps its own figure.'}</div>`:''}
      <div class="hint" style="margin-bottom:9px">${g.status==='posted'
        ? 'Posted — stock is updated. Correct it by unposting on the desktop app.'
        : unbal ? `⚠ ${unbal} line${unbal===1?'':'s'} broken down to the wrong total — fix, or record what didn't arrive as a shortage.`
        : 'Posting creates a product and a QR for every size, adds the stock, and averages the cost.'}</div>
      ${g.status==='posted'
        ? `<button class="btn" id="showqr">Show QR codes</button>`
        : `<button class="btn" id="post"${unbal?' disabled':''}>Post to inventory</button>`}
    </div>`;

  document.getElementById('back').onclick=()=>{ S.screen='grn'; render(); };
  app.querySelectorAll('[data-break]').forEach(b=>b.onclick=()=>openBreak(g.lines[+b.dataset.break]));
  app.querySelectorAll('[data-short]').forEach(b=>b.onclick=()=>openShort(g.lines[+b.dataset.short]));
  // arrives with the unaccounted quantity already filled in — it is the number
  // the receiver has just been told about, so retyping it is only a chance to err
  app.querySelectorAll('[data-shortgap]').forEach(b=>b.onclick=()=>{
    const l=g.lines[+b.dataset.shortgap]; openShort(l, gap(l)); });
  // a category chosen here means the products are born mapped, instead of landing
  // "unmapped" in Inventory for someone to fix one by one — and the server learns
  // the wording, so the next invoice phrased that way maps itself
  const setCat=async (line,v)=>{
    try{ await api('/api/purchases/lines/'+line.id,{method:'PATCH',body:JSON.stringify({category:v})});
      await reloadGrn(); render();
    }catch(e){ toast(e.message); }
  };
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    const l=g.lines[+b.dataset.cat];
    pickSheet('Category', S.cats, l.category||'', (v)=>setCat(l,v), true);
  });
  app.querySelectorAll('[data-usecat]').forEach(b=>b.onclick=()=>{
    const l=g.lines[+b.dataset.usecat];
    setCat(l, l.category_suggestion.best);
  });
  app.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>
    scanInto(g.lines[+b.dataset.scan], b.dataset.split?+b.dataset.split:null));
  const pb=document.getElementById('post'); if(pb) pb.onclick=postGrn;
  const sq=document.getElementById('showqr'); if(sq) sq.onclick=()=>{ S.postResult=null; S.screen='grnposted'; render(); };
}

// Pin a line (or one variant of it) to a product that already exists — for goods
// we already carry, where the supplier's wording drifts between invoices.
function scanInto(line, splitId){
  const send=async (code)=>{
    try{
      await api(`/api/purchases/lines/${line.id}/scan`,{method:'POST',body:JSON.stringify({code:code,split_id:splitId})});
      await reloadGrn(); render(); toast('✓ Linked to that product');
    }catch(e){ toast(e.message); }
  };
  if('BarcodeDetector' in window) return openScanner(send);
  const code=prompt('Scan or type the QR code / SKU for this row:');
  if(code&&code.trim()) send(code.trim());
}

async function postGrn(){
  const rows=S.grn.lines.reduce((n,l)=>n+(l.splits.length||1),0);
  const sh=S.grn.shortages||{};
  // A shortage is stated at the moment it stops being editable, because posting
  // is what turns "40 arrived" into the stock figure and "10 short" into a claim.
  if(!confirm(`Post this GRN?\n\n${rows} item${rows===1?'':'s'} go into stock. Each new one gets its own SKU and QR code, and its cost is averaged into inventory.`
      +(sh.claimable_qty?`\n\n⚠ ${qtyOf(sh.claimable_qty)} short or damaged (₹${money(sh.claimable_value)}) stays OUT of stock and becomes a claim against the supplier. The invoice keeps its own quantity.`:'')
      +`\n\nCorrecting a posted GRN means unposting it on the desktop app.`)) return;
  const btn=document.getElementById('post'); if(btn) btn.disabled=true;
  try{
    S.postResult=await api(`/api/purchases/${S.grn.id}/post`,{method:'POST'});
    await reloadGrn();                       // now carries each variant's product
    S.screen='grnposted'; render();
    if(S.postResult.short_qty) toast(`Posted · ${qtyOf(S.postResult.short_qty)} short, ₹${money(S.postResult.short_value)} to claim`);
  }catch(e){ toast('Post failed: '+e.message); if(btn) btn.disabled=false; }
}

// ---------- shortage entry: what was billed and wasn't in the box ----------
// The step that has to happen before Post to inventory, and the only person who
// can do it is the one opening the cartons. Without it the receiver's choices are
// both lies — type in ten pieces that don't exist so the breakdown balances, or
// leave the receipt unpostable — and after posting the gap is invisible: stock
// says 40, the invoice says 50, and nothing remembers why. Recorded here it is a
// document the debit note is later built from without anyone counting again.
const SHORT_KINDS=[['short','Short','not in the box'],
                   ['damaged','Damaged','arrived unusable, rejected'],
                   ['excess','Excess','more arrived than billed']];
const shortTotals=(rows)=>{
  let missing=0, excess=0;
  (rows||[]).forEach(r=>{ const q=+r.qty||0; if(r.kind==='excess') excess+=q; else missing+=q; });
  return {missing:qtyOf(missing), excess:qtyOf(excess)};
};
const blankShort=(kind,qty)=>({kind:kind||'short', qty:qty!=null?String(qty):'',
                               variant:'', reason:'', note:''});

async function loadShortOpts(){
  if(S.shortOpts) return S.shortOpts;
  try{ S.shortOpts=await api('/api/purchases/shortage-options'); }
  catch(e){ S.shortOpts={reasons:[]}; }
  return S.shortOpts;
}

// `preset` is the quantity the breakdown couldn't account for — arriving here
// from "not received?" means the number is already known and shouldn't be retyped
async function openShort(line, preset){
  S.shortLine=line;
  await loadShortOpts();
  S.shrows=(line.shortages&&line.shortages.length)
    ? line.shortages.map(sh=>({kind:sh.kind, qty:String(sh.qty), variant:sh.variant||'',
                               reason:sh.reason||'', note:sh.note||''}))
    : [blankShort('short', preset)];
  S.screen='grnshort'; render();
}

function renderShort(){
  const l=S.shortLine; if(!l){ S.screen='grndetail'; return render(); }
  const billed=+l.qty||0;
  const t=shortTotals(S.shrows);
  const received=qtyOf(billed-t.missing+t.excess);
  const reasons=(S.shortOpts&&S.shortOpts.reasons)||[];

  const rowHtml=(r,i)=>`<div class="prow" style="display:block">
      <div class="row" style="align-items:center;gap:8px">
        <span style="color:var(--muted);font-size:12px;font-weight:700">${i+1}</span>
        <div class="t" style="flex:1;min-width:0">${esc((SHORT_KINDS.find(k=>k[0]===r.kind)||[])[1]||r.kind)}${r.qty?' · '+qtyOf(r.qty)+' '+esc(l.uom||''):''}</div>
        <button class="link" style="font-size:20px;color:var(--muted)" data-shdel="${i}">×</button>
      </div>
      <div class="row" style="overflow:auto;gap:8px;margin-top:9px">
        ${SHORT_KINDS.map(([k,lab])=>`<div class="chip ${r.kind===k?'on':''}" data-shkind="${i}:${k}">${lab}</div>`).join('')}
      </div>
      <div class="hint" style="margin-top:6px">${esc((SHORT_KINDS.find(k=>k[0]===r.kind)||[])[2]||'')}</div>
      <div class="row" style="gap:8px;align-items:flex-end;margin-top:9px">
        <div style="flex:1"><label>How many</label>
          <input inputmode="decimal" data-shqty="${i}" value="${esc(r.qty)}" placeholder="0" style="padding:10px 12px"></div>
        <button class="btn sec" style="width:auto;padding:11px 13px" data-shrest="${i}">rest</button>
      </div>
      <div class="field" style="margin-top:11px"><label>Reason</label>
        <button class="selbtn ${r.reason?'':'empty'}" data-shreason="${i}">${esc(r.reason||'Why?')}</button></div>
      <div class="field"><label>Which ones (if you can tell)</label>
        <input data-shtxt="${i}:variant" value="${esc(r.variant)}" placeholder="e.g. S / White — leave blank if unknown"></div>
      <div class="field" style="margin-bottom:0"><label>Note</label>
        <input data-shtxt="${i}:note" value="${esc(r.note)}" placeholder="anything the office should see"></div>
    </div>`;

  app.innerHTML=`<div class="topbar"><button class="link" id="shcancel">‹ Cancel</button><h1>Shortage</h1></div>
    <div class="controls">
      <div class="detname" style="font-size:18px">${esc(l.description||'(unnamed)')}</div>
      <div class="detmeta">Billed ${qtyOf(billed)} ${esc(l.uom||'')} × ₹${money(l.rate)}</div>
      <div class="detmeta" id="shprog"></div>
      <div class="hint">Record what the supplier billed and the boxes didn't hold. The
        invoice still says ${qtyOf(billed)} — only ${received} goes into stock, and the
        difference becomes a claim against the supplier.</div>
    </div>
    <div class="list">
      ${S.shrows.map(rowHtml).join('')}
      <button class="btn sec" id="shadd" style="margin-bottom:10px">+ add another</button>
      ${(l.shortages&&l.shortages.length)?`<button class="btn sec" id="shclear" style="color:var(--danger)">No shortage after all</button>`:''}
    </div>
    <div class="actionbar"><button class="btn" id="shsave">Save shortage</button></div>`;
  updShortProg();

  document.getElementById('shcancel').onclick=()=>{ S.screen='grndetail'; render(); };
  document.getElementById('shadd').onclick=()=>{ S.shrows.push(blankShort('short')); render(); };
  app.querySelectorAll('[data-shdel]').forEach(b=>b.onclick=()=>{
    S.shrows.splice(+b.dataset.shdel,1); if(!S.shrows.length) S.shrows.push(blankShort('short')); render(); });
  app.querySelectorAll('[data-shkind]').forEach(c=>c.onclick=()=>{
    const p=c.dataset.shkind.split(':'); S.shrows[+p[0]].kind=p[1]; render(); });
  // typing updates state and the running total only — re-rendering on every
  // keystroke would take the keyboard's focus with it
  app.querySelectorAll('[data-shqty]').forEach(inp=>inp.addEventListener('input',e=>{
    S.shrows[+inp.dataset.shqty].qty=e.target.value; updShortProg(); }));
  app.querySelectorAll('[data-shtxt]').forEach(inp=>inp.addEventListener('input',e=>{
    const p=inp.dataset.shtxt.split(':'); S.shrows[+p[0]][p[1]]=e.target.value; }));
  app.querySelectorAll('[data-shrest]').forEach(b=>b.onclick=()=>{
    // "rest" here means the balance the breakdown could not account for — the
    // number the receiver is staring at on the previous screen
    const i=+b.dataset.shrest;
    const others=S.shrows.reduce((n,r,j)=>n+(j===i||r.kind==='excess'?0:(+r.qty||0)),0);
    const assigned=(l.splits||[]).reduce((n,s)=>n+(+s.qty||0),0);
    const gap=assigned>0 ? billed-assigned-others : billed-others;
    S.shrows[i].qty=String(qtyOf(Math.max(0,gap)));
    const inp=app.querySelector(`[data-shqty="${i}"]`); if(inp) inp.value=S.shrows[i].qty;
    updShortProg();
  });
  app.querySelectorAll('[data-shreason]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.shreason;
    pickSheet('Reason', reasons, S.shrows[i].reason, (v)=>{ S.shrows[i].reason=v; render(); }, true);
  });
  const sc=document.getElementById('shclear');
  if(sc) sc.onclick=()=>{ if(confirm('Clear the shortage?\n\nThe whole billed quantity goes back to being expected in stock.')) saveShort([]); };
  document.getElementById('shsave').onclick=submitShort;
}

function updShortProg(){
  const l=S.shortLine, billed=+l.qty||0;
  const t=shortTotals(S.shrows);
  const received=qtyOf(billed-t.missing+t.excess);
  const el=document.getElementById('shprog');
  if(!el) return;
  const rate=+l.rate||0;
  el.innerHTML=`Into stock <b>${received}</b> of ${qtyOf(billed)} billed`
    +(t.missing?` · <span style="color:var(--warn)">${t.missing} short — ₹${money(t.missing*rate)} to claim</span>`:'')
    +(t.excess?` · <span style="color:var(--ok)">${t.excess} extra</span>`:'');
}

function submitShort(){
  const l=S.shortLine, billed=+l.qty||0;
  const kept=S.shrows.filter(r=>+r.qty>0);
  if(!kept.length){ toast('Enter how many were missing, damaged or extra'); return; }
  const t=shortTotals(kept);
  if(t.missing>billed+0.001){
    toast(`${t.missing} short of ${qtyOf(billed)} billed — that's more than the invoice`); return; }
  if(kept.some(r=>!r.reason)&&!confirm('No reason on one of these rows.\n\nThe office will be claiming money back from the supplier — a reason is what they argue with.\n\nSave anyway?')) return;
  saveShort(kept);
}

async function saveShort(rows){
  const l=S.shortLine;
  try{
    await api(`/api/purchases/lines/${l.id}/shortages`,{
      method:'PUT', body:JSON.stringify({rows:rows, recorded_by:S.employee||S.user||''})});
    await reloadGrn();
    S.screen='grndetail'; render();
    const t=shortTotals(rows);
    toast(rows.length ? `✓ ${t.missing?t.missing+' short':t.excess+' extra'} recorded` : '✓ Shortage cleared');
  }catch(e){ toast(e.message); }
}

// ---------- the breakdown editor ----------
function openBreak(line){
  S.grnLine=line; S.sopen={};
  S.srows=line.splits.length
    ? line.splits.map(sp=>{ const r=blankRow(line.rate);
        Object.keys(r).forEach(k=>{ if(sp[k]!=null&&sp[k]!=='') r[k]=String(sp[k]); }); return r; })
    // a first row inherits the line's category (or the mapping it would get), so
    // the common case — one category, several sizes — needs no repetition
    : [blankRow(line.rate, line.category||(line.category_suggestion&&line.category_suggestion.best))];
  S.screen='grnbreak'; render();
}

// The target is what ARRIVED, not what was billed — once a shortage is recorded
// the rows only have to reach the received quantity, which is the whole point of
// recording it.
function breakTarget(l){ return +(l.received_qty!=null?l.received_qty:l.qty)||0; }

function updProgress(){
  const l=S.grnLine, target=breakTarget(l), billed=+l.qty||0;
  const assigned=S.srows.reduce((n,r)=>n+(+r.qty||0),0);
  const done=sameQty(assigned,target);
  const left=qtyOf(target-assigned);
  const p=document.getElementById('prog');
  if(p){
    p.textContent=`${qtyOf(assigned)} of ${qtyOf(target)} ${l.uom||''} assigned`
      +(l.has_shortage?` (${qtyOf(billed)} billed, ${qtyOf(l.missing_qty)} short)`:'')
      +(done?' ✓':` · ${left} left`);
    p.style.color=done?'var(--ok)':'var(--muted)';
  }
  const bar=document.getElementById('bar');
  if(bar){
    bar.style.width=Math.min(100,target?(assigned/target)*100:0)+'%';
    bar.style.background=done?'var(--ok)':'var(--accent)';
  }
  // offered here as well as on the line: this is where a receiver first notices
  // the sizes don't add up, and "the rest never came" is a real answer
  const sg=document.getElementById('shortgap');
  if(sg){
    sg.style.display=(!l.has_shortage&&left>0&&assigned>0)?'block':'none';
    sg.textContent=`${left} not in the box? record as shortage →`;
  }
}

function addRow(size){
  if(size&&S.srows.some(r=>r.size===size)){ toast(size+' is already a row — set its quantity'); return; }
  const last=S.srows[S.srows.length-1]||{};
  const cat=last.category||S.grnLine.category||(S.grnLine.category_suggestion&&S.grnLine.category_suggestion.best);
  // a size chip fills the empty row the editor opens with rather than adding a
  // second one below it: an untouched row above the one being typed into is both
  // clutter and a trap — it fails validation at save
  const blank=S.srows.findIndex(r=>!vLabel(r)&&!r.qty);
  if(size&&blank>-1) S.srows[blank].size=size;
  else S.srows.push(Object.assign(blankRow(S.grnLine.rate,cat), size?{size:size}:{}));
  render();
}

function renderBreak(){
  const l=S.grnLine; if(!l){ S.screen='grndetail'; return render(); }
  const rowHtml=(r,i)=>`<div class="prow" style="display:block">
      <div class="row" style="align-items:center;gap:8px">
        <span style="color:var(--muted);font-size:12px;font-weight:700">${i+1}</span>
        <div class="t" style="flex:1;min-width:0">${esc(vLabel(r)||'new item')}</div>
        <button class="link" style="font-size:20px;color:var(--muted)" data-del="${i}">×</button>
      </div>
      <div class="row" style="gap:8px;align-items:flex-end;margin-top:8px">

  if(cb) cb.onclick=()=>{ if(confirm('Clear the breakdown?\n\nThe line goes back to one product for the whole billed quantity.')) saveBreak([]); };

}

// The same rules the server enforces, checked here so a picker is told before the
// round trip rather than after it.
function submitBreak(){
  const l=S.grnLine;
  const kept=S.srows.filter(r=>vLabel(r)||r.qty);
  for(const r of kept){
    if(!vLabel(r)){ toast('Every row needs at least one attribute — a size, colour, material…'); return; }
    if(!(+r.qty>0)){ toast(`“${vLabel(r)}”: enter a quantity greater than zero`); return; }
  }
  // identity is the WHOLE attribute tuple, exactly as the server compares it —
  // not the label, which two different tuples can share
  const keys=kept.map(r=>SPLIT_ATTRS.map(([k])=>(r[k]||'').trim().toLowerCase()).join(' '));
  const dup=keys.findIndex((x,i)=>keys.indexOf(x)!==i);
  if(dup>-1){ toast(`“${vLabel(kept[dup])}” appears twice — merge those rows`); return; }
  const assigned=kept.reduce((n,r)=>n+(+r.qty||0),0);
  const target=breakTarget(l);
  // short of the target: say so, and say the thing the receiver may not know —
  // that "the rest never came" is an answer the system will take
  if(kept.length&&!sameQty(assigned,target)
     && !confirm(`The rows add up to ${qtyOf(assigned)} of ${qtyOf(target)}`
        +(l.has_shortage?` received (${qtyOf(l.qty)} billed).`:` billed.`)+`\n\n`
        +(assigned<target&&!l.has_shortage
          ? `If the missing ${qtyOf(target-assigned)} simply weren't in the box, don't invent them — `
            +`save, then use “Something missing or damaged?” to record them as a shortage.\n\n`
          : `That's fine to save and come back to — the GRN just can't be posted until it balances.\n\n`)
        +`Save anyway?`)) return;
  saveBreak(kept);
}

async function saveBreak(rows){
  const btn=document.getElementById('savebd'); if(btn) btn.disabled=true;
  try{
    await api(`/api/purchases/lines/${S.grnLine.id}/splits`,{method:'PUT',body:JSON.stringify({rows:rows})});
    await reloadGrn();
    toast(rows.length?`✓ Broken into ${rows.length} item${rows.length===1?'':'s'}`:'✓ Breakdown cleared');
    S.screen='grndetail'; render();
  }catch(e){ toast(e.message); if(btn) btn.disabled=false; }
}

  catch(e){ toast('No bundle for that code'); }
}

  document.getElementById('lo2').onclick=()=>{ localStorage.removeItem('essa_token'); S.token=''; S.screen='login'; render(); };
  document.getElementById('lrrefresh').onclick=paintLR;
  app.querySelectorAll('.chip[data-lf]').forEach(c=>c.onclick=()=>{ S.lrFilter=c.dataset.lf; paintLR(); });
  wireTabs();
  loadReceivers();
  paintLR();
}

async function paintLR(){
  const el=document.getElementById('lrlist'); if(el) el.innerHTML='<div class="spin"></div>';
  try{ S.lr = await api(`/api/lr?received=${S.lrFilter}&limit=300`); }
  catch(e){ S.lr=[]; toast('Could not load consignments'); }
  const cnt=document.getElementById('lrcnt'); if(cnt) cnt.textContent=S.lr.length+' shown';
  const list=document.getElementById('lrlist'); if(!list) return;
  if(!S.lr.length){
    list.innerHTML=`<p style="color:var(--muted);text-align:center;margin-top:30px">${
      S.lrFilter==='pending'?'Nothing waiting — every consignment has been taken in.':'No consignments.'}</p>`;
    return;
  }
  list.innerHTML = S.lr.map((r,i)=>{
    const bits=[r.transport, r.lr_no && ('LR '+r.lr_no), r.bundle&&(r.bundle+' bundle'), r.qty&&(r.qty+' pcs')].filter(Boolean);
    const inv=[r.inv_no && ('Inv '+r.inv_no), r.recv_date].filter(Boolean).join(' · ');
    return `<div class="prow" data-i="${i}">
      <div style="flex:1;min-width:0">
        <div class="t">${esc(r.supplier_name||'(no supplier)')}</div>
        <div class="m">${esc(bits.join(' · '))}</div>
        <div class="m">${esc(inv)}</div>
      </div>
      <div class="badge ${r.received_by?'bdone':'bpend'}">${r.received_by?esc(r.received_by):'receive'}</div>
    </div>`;
  }).join('');
  // open the consignment rather than receiving it on the spot: you should see what
  // arrived — and be able to name whoever actually took it — before confirming
  list.querySelectorAll('.prow').forEach(row=>row.onclick=()=>{
    S.lrSel=S.lr[+row.dataset.i]; S.screen='lrdetail'; render();
  });
}

// ---------- one consignment: what arrived, and who took it ----------
function renderLRDetail(){
  const r=S.lrSel;
  if(!r){ S.screen='lr'; return render(); }
  const status = (r.mismatches&&r.mismatches.length) ? ['⚠ invoice conflict','var(--warn)']
               : r.matched ? ['✓ invoice linked','var(--ok)']
               : ['invoice pending','var(--muted)'];
  const fields = [
    ['Supplier', r.supplier_name], ['Transport', r.transport],
    ['LR No', r.lr_no], ['LR date', r.lr_date], ['Received date', r.recv_date],
    ['Bundles', r.bundle], ['Quantity', r.qty!=null?(r.qty+' pcs'):''],
    ['Boxes', r.boxes], ['Item', r.item],
    ['Invoice No', r.inv_no], ['Invoice date', r.inv_date],
    ['Invoice amount', r.amount!=null?('₹ '+money(r.amount)):''],
    ['Paid / ToPay', r.paid_topay],
    ['Freight', r.freight_amount!=null?('₹ '+money(r.freight_amount)):''],
  ].filter(([,v])=>v!==null&&v!==''&&v!==undefined);
  const line=([k,v])=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--muted);font-size:13px">${esc(k)}</span>
      <span style="text-align:right;font-weight:600">${esc(v)}</span></div>`;

  app.innerHTML=`<div class="topbar"><button class="link" id="back">‹ Back</button><h1></h1></div>
    <div class="detwrap">
      <div class="detname">${esc(r.supplier_name||'(no supplier)')}</div>
      <div class="detmeta">${esc([r.transport, r.lr_no&&('LR '+r.lr_no)].filter(Boolean).join(' · '))}</div>
      <div class="detmeta" style="color:${status[1]}">${status[0]}</div>
      <div style="height:10px"></div>
      ${fields.map(line).join('')}
      <div style="height:16px"></div>
      ${r.received_by?`<div class="hint" style="color:var(--ok);margin-bottom:8px">Already received by ${esc(r.received_by)} — saving again replaces the name.</div>`:''}
      <div class="field"><label>Received by (who took the packages)</label>
        <input id="rby" list="rnames" placeholder="e.g. Ramesh" value="${esc(r.received_by||S.employee||'')}"></div>
      <datalist id="rnames">${(S.receivers||[]).map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
      <button class="btn" id="rcv">${r.received_by?'Update receiver':'Receive consignment'}</button>
      ${r.received_by?`<button class="btn" id="undo" style="margin-top:10px;background:var(--panel2);color:var(--muted)">Undo receipt</button>`:''}
      <div style="height:30px"></div>
    </div>`;

  document.getElementById('back').onclick=()=>{ S.screen='lr'; render(); };
  document.getElementById('rcv').onclick=async ()=>{
    const name=document.getElementById('rby').value.trim();
    if(!name){ toast('Enter who received it'); return; }
    document.getElementById('rcv').disabled=true;
    try{
      await api(`/api/lr/${r.id}/receive`,{method:'POST',body:JSON.stringify({received_by:name})});
      // remember the last name typed — usually the same person receives all day
      S.employee=name; localStorage.setItem('essa_emp',name);
      await loadReceivers();
      toast('✓ Received by '+name);
      S.screen='lr'; render();
    }catch(e){ toast('Could not save: '+e.message); document.getElementById('rcv').disabled=false; }
  };
  const un=document.getElementById('undo');
  if(un) un.onclick=async ()=>{
    if(!confirm('Undo this receipt? The consignment goes back to pending.')) return;
    try{ await api(`/api/lr/${r.id}/receive`,{method:'DELETE'});
      toast('✓ Back to pending'); S.screen='lr'; render();
    }catch(e){ toast('Could not undo: '+e.message); }
  };
}

async function loadReceivers(){
  try{ S.receivers = await api('/api/lr/receivers'); }catch(e){ S.receivers=[]; }
}

function renderDetail(){
  const p=S.selected;
  const f={color:p.color||'',size:p.size||'',pattern:p.pattern||'',fit:p.fit||'',product_type:p.product_type||'',material:p.material||'',
    design_no:p.design_no||'',mrp:p.mrp??'',sale_price:p.sale_price??'',sale_discount_pct:p.sale_discount_pct??''};
  const selRow=(key,label)=>`<div class="field"><label>${label}</label>
    <button class="selbtn ${f[key]?'':'empty'}" data-sel="${key}">${esc(f[key]||'Select…')}</button></div>`;
  app.innerHTML=`<div class="topbar"><button class="link" id="back">‹ Back</button><h1></h1></div>
    <div class="detwrap">
      <div class="detname">${esc(p.description)}</div>
      <div class="detmeta">${esc(p.sku)} · HSN ${esc(p.hsn||'—')} · stock ${p.stock_qty} ${esc(p.uom||'')}</div>
      <div class="detmeta">from ${esc(p.supplier_name||'—')} · cost ₹${money(p.avg_cost)}</div>
      <div class="detmeta">${p.category
        ? 'category <b>'+esc(p.category)+'</b>'+(p.category_section?' ('+esc(p.category_section)+')':'')
        : '<span style="color:var(--warn)">category not mapped</span>'}</div>
      <div style="height:14px"></div>
      ${selRow('color','Color')}${selRow('size','Size')}${selRow('pattern','Pattern')}
      ${selRow('fit','Fit')}${selRow('product_type','Type')}${selRow('material','Material')}
      <div class="field"><label>Design No</label><input id="design_no" value="${esc(f.design_no)}" placeholder="e.g. SH-05"></div>
      <div class="row">
        <div class="field" style="flex:1"><label>MRP</label><input id="mrp" inputmode="decimal" value="${esc(f.mrp)}"></div>
        <div class="field" style="flex:1"><label>Sale price</label><input id="sale_price" inputmode="decimal" value="${esc(f.sale_price)}"></div>
        <div class="field" style="flex:1"><label>Discount %</label><input id="sale_discount_pct" inputmode="decimal" value="${esc(f.sale_discount_pct)}"></div>
      </div>
      ${p.detailed?`<div class="hint" style="color:var(--ok)">Already detailed by ${esc(p.detailed_by||'—')}. Saving updates it.</div>`:''}
      <button class="btn" id="save" style="margin-top:8px">Save details</button>
      <div style="height:30px"></div>
    </div>`;
  // back to whichever list opened this: the Products tab, or the receipt's
  // item list when detailing what a GRN just created
  document.getElementById('back').onclick=()=>{ S.screen=S.detailBack||'list'; render(); };
  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sel,f,b));
  document.getElementById('save').onclick=async ()=>{
    const num=v=>v===''||v==null?null:Number(v);
    const body={color:f.color,size:f.size,pattern:f.pattern,fit:f.fit,product_type:f.product_type,material:f.material,
      design_no:document.getElementById('design_no').value,
      mrp:num(document.getElementById('mrp').value),sale_price:num(document.getElementById('sale_price').value),
      sale_discount_pct:num(document.getElementById('sale_discount_pct').value),detailed_by:S.employee||'mobile'};
    document.getElementById('save').disabled=true;
    try{ await api(`/api/inventory/products/${p.id}/detail`,{method:'POST',body:JSON.stringify(body)});
      toast('✓ Saved · QR confirmed');
      // re-read the receipt so the item ticks over to "detailed"
      if(S.detailBack==='grnposted'&&S.grn){ try{ await reloadGrn(); }catch(e){} }
      if(S.detailBack==='bundle'&&S.bundle){ try{ await reloadBundle(); }catch(e){} }
      S.screen=S.detailBack||'list'; render(); }
    catch(e){ toast('Save failed: '+e.message); document.getElementById('save').disabled=false; }
  };
}

function openSheet(key,f,btn){
  pickSheet(key.replace('_',' '), S.options[key]||[], f[key], (v)=>{
    f[key]=v; btn.textContent=v||'Select…'; btn.classList.toggle('empty',!v);
  });
}

// One box, two jobs: it filters the list as you type and it is also how a value
// that isn't in the list gets used. The category master runs to hundreds of
// names — scrolling that on a phone is not a thing anyone does twice.
function pickSheet(title, options, current, onPick, allowClear){
  const opts=(options||[]).slice();
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="sheetcard">
    <div class="sheethd"><span>${esc(title)}</span><button class="link" id="x">×</button></div>
    <div class="row" style="padding:10px 12px;gap:8px"><input id="cst" placeholder="Type to search, or enter your own…"><button class="btn" style="width:auto;padding:12px 16px" id="use">Use</button></div>
    ${allowClear&&current?`<div class="opt" id="clr" style="color:var(--muted)">— clear —</div>`:''}
    <div style="overflow:auto" id="opts"></div>
  </div>`;
  document.body.appendChild(sh);
  const pick=(v)=>{ sh.remove(); onPick(v); };
  const paintOpts=(q)=>{
    const t=(q||'').trim().toLowerCase();
    const shown=t?opts.filter(o=>String(o).toLowerCase().includes(t)):opts;
    sh.querySelector('#opts').innerHTML = shown.length
      ? shown.map(o=>`<div class="opt ${o===current?'sel':''}" data-o="${esc(o)}">${esc(o)}</div>`).join('')
      : `<p style="color:var(--muted);padding:16px;font-size:14px">Nothing matches — tap Use to enter it anyway.</p>`;
    sh.querySelectorAll('.opt[data-o]').forEach(o=>o.onclick=()=>pick(o.dataset.o));
  };
  paintOpts('');
  sh.querySelector('#x').onclick=()=>sh.remove();
  sh.onclick=(e)=>{ if(e.target===sh) sh.remove(); };
  const clr=sh.querySelector('#clr'); if(clr) clr.onclick=()=>pick('');
  sh.querySelector('#cst').addEventListener('input',e=>paintOpts(e.target.value));
  sh.querySelector('#use').onclick=()=>{ const v=sh.querySelector('#cst').value.trim(); if(v) pick(v); };
}
</script>
