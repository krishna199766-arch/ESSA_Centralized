# The server half of the deployment, declared rather than clicked.
#
# Render reads this on "New → Blueprint" and creates the service, the disk and
# the environment variables in one step. The UI on Vercel proxies to whatever
# hostname this ends up with — see docs/DEPLOYMENT.md.
services:
  - type: web
    name: essa-warehouse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Singapore is the closest region to Tiruppur. Oregon is the default and
    # would put roughly a quarter-second of Pacific on every request the
    # warehouse makes.
    region: singapore
    plan: starter          # free instances sleep; the 9am first load waits ~30s
    healthCheckPath: /api/status

    # THE important line. Everything the warehouse produces lives here — the
    # database, the uploaded invoice images, the vision key saved from the
    # settings screen. Without this disk each deploy starts an empty warehouse,
    # and the loss is silent.
    disk:
      name: essa-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # Generated by Render, different per service, never in the repo. This
      # signs every login token; see backend/app/services/users.py.
      - key: ESSA_AUTH_SECRET
        generateValue: true

      # sync: false means Render asks for these in the dashboard instead of
      # reading them here — a password committed to a public repo is not a
      # password. Set all three BEFORE the first deploy: the accounts are
      # seeded only when missing, so setting them afterwards does nothing.
      - key: ESSA_SUPERADMIN_PASSWORD
        sync: false
      - key: ESSA_ADMIN_PASSWORD
        sync: false
      - key: ESSA_USER_PASSWORD
        sync: false

      # Optional — vision extraction can also be switched on from the settings
      # screen, which stores the key on the disk above.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Both are set in the Dockerfile too; repeated here so this file reads as
      # the whole story, and so DATABASE_URL is pinned to the shop's SQLite
      # before anything else claims that very generic name.
      - key: ESSA_STATE_DIR
        value: /data
      - key: DATABASE_URL
        value: sqlite:////data/textile_shop.db
